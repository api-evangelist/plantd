aid: plantd
name: Plantd
description: 'Plantd is an American advanced-materials manufacturer based in Oxford,
  North Carolina, founded in 2021 by former SpaceX engineers Nathan Silvernail (CEO)
  and Huade Tan (CTO) with Josh Dorfman (CMO). The company grows and harvests fast-growing
  perennial grass on farms across North Carolina and Virginia and presses it into
  carbon-negative structural building panels intended to replace oriented strand board
  (OSB), plywood and other timber-based sheathing. Production runs on a modular, all-electric,
  closed-loop manufacturing platform in a 150,000+ sq ft facility, with a research
  farm in Stovall, NC. Customers and partners include homebuilder D.R. Horton and
  furniture brand Studio TK. Plantd has raised roughly $47.5M across seed, Series A
  and a $22M Series B (October 2025). Plantd is a physical-goods manufacturer: it
  publishes no developer program, no public API, and no machine-readable API contract
  of any kind — this profile records that absence rather than an API surface.'
